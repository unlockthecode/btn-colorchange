<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Button Color Changer</title>
    <style>
        body{
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: white;
        }
        body.dark-mode {
            background-color: #121212;
        }
        
        #btn-main {
            padding: 150px 250px;
            font-size: 200px;
            background-color: lightgray;
            border: none;
            cursor: pointer;
        }

        #btn-darkmode {
            position: absolute;
            top: 30px;
            right: 30px;
            font-size: 30px;
            background: none;
            border: none;
            cursor: pointer;
        }

    </style>
</head>
<body>
    <button id="btn-main">CLICK ME</button>
    <button id="btn-darkmode">🌙</button>
    <script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Button Color Changer</title>
    <style>
        body{
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: white;
        }
        body.dark-mode {
            background-color: #121212;
        }
        
        #btn-main {
            padding: 150px 250px;
            font-size: 200px;
            background-color: lightgray;
            border: none;
            cursor: pointer;
        }

        .top-buttons {
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: absolute;
            top: 30px;
            left: 0;
            right: 0;
            width: 100%;
            padding: 0 30px;
            box-sizing: border-box;
            pointer-events: none;
        }
        .top-buttons button {
            font-size: 30px;
            background: none;
            border: none;
            cursor: pointer;
            pointer-events: auto;
        }

        /* RESIZING VIA MEDIA QUERIES */
        @media (max-width: 1200px) {
            #btn-main {
                padding: 80px 165px;
                font-size: 120px;
            }
        }

        @media (max-width: 800px) {
            #btn-main {
                padding: 60px 125px;
                font-size: 90px;
            }
        }

        @media (max-width: 600px) {
            #btn-main {
                padding: 40px 85px;
                font-size: 30px;
            }
        }

    </style>
</head>
<body>
    <div class="top-buttons">
        <button id="btn-spam">💥</button>
        <button id="btn-loop" aria-label="Loop">🔁</button>
        <button id="btn-darkmode">🌙</button>
    </div>
    <button id="btn-main">CLICK ME</button>
    <script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Button Color Changer</title>
    <style>
        body{
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: white;
        }
        body.dark-mode {
            background-color: #121212;
        }
        
        #btn-main {
            padding: 150px 250px;
            font-size: 200px;
            background-color: lightgray;
            border: none;
            cursor: pointer;
        }

        #btn-darkmode {
            position: absolute;
            top: 30px;
            right: 30px;
            font-size: 30px;
            background: none;
            border: none;
            cursor: pointer;
        }

        #btn-spam {
            position: absolute;
            top: 30px;
            left: 30px;
            font-size: 30px;
            background: none;
            border: none;
            cursor: pointer;
        }

        /* RESIZING VIA MEDIA QUERIES */
        @media (max-width: 1200px) {
            #btn-main {
                padding: 100px 200px;
                font-size: 150px;
            }
        }
        
        @media (max-width: 600px) {
            #btn-main {
                padding: 40px 85px;
                font-size: 30px;
            }
        }

    </style>
</head>
<body>
    <button id="btn-main">CLICK ME</button>
    <button id="btn-spam">💥</button>
    <button id="btn-darkmode">🌙</button>
    <script src="script.js"></script>
</body>
</html>
